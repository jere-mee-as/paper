<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,interactive-widget=resizes-content">
<meta name="color-scheme" content="light">
<title>Paper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  /* Every color below is set by the theme (src/themes.js); these are the Paper defaults. */
  --bg:#ECE9E2; --bgRGB:236,233,226; --ink:#171614; --inkRGB:23,22,20; --ink2:#5F5B54;
  --line:rgba(var(--inkRGB),.13); --line2:rgba(var(--inkRGB),.28); --soft:rgba(var(--inkRGB),.07);
  --acc:#C4551F; --onAcc:#141312; --sheet:#F5F3EE; --card:rgba(255,255,255,.5); --pop:#FBFAF7; --red:#B42318;
  --glass:rgba(255,255,255,.58); --glassEdge:rgba(255,255,255,.75); --chipGlass:rgba(255,255,255,.65);
  --mono:'IBM Plex Mono',ui-monospace,'Roboto Mono',monospace;
  --sans:Inter,system-ui,'Roboto',sans-serif;
  --pad:28px; --ease:cubic-bezier(.22,1,.36,1); --pop:cubic-bezier(.34,1.4,.64,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
input{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
h1{margin:0;font-weight:300;font-size:42px;line-height:1.05;letter-spacing:-1.6px}
@keyframes rise{from{opacity:0;transform:translate3d(0,16px,0)}to{opacity:1;transform:none}}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* frosted glass */
.glass{background:var(--glass);border:1px solid var(--glassEdge);box-shadow:inset 0 1px 0 var(--glassEdge),0 10px 30px rgba(0,0,0,.06);
  -webkit-backdrop-filter:blur(24px) saturate(1.2);backdrop-filter:blur(24px) saturate(1.2)}
.card{border-radius:24px;padding:14px 18px;display:flex;flex-direction:column;gap:6px;margin-bottom:10px}

#app{position:fixed;inset:0;overflow:hidden;overflow:clip;touch-action:none}
#wall,#wallOld{position:absolute;inset:0;pointer-events:none}
#wallOld{opacity:0}
#wx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#bolt{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#bolt.flash{animation:bolt 1.1s ease-out}
@keyframes bolt{0%{opacity:0}4%{opacity:.5}10%{opacity:.05}16%{opacity:.35}100%{opacity:0}}
#app.theming,#app.theming *{transition:color .5s,background-color .5s,border-color .5s,fill .5s,stroke .5s!important}
#stage{position:absolute;inset:0;overflow:hidden;overflow:clip;transform-origin:50% 42%;will-change:transform,filter}
#track{position:absolute;top:0;left:0;height:100%;width:200%;display:flex;will-change:transform}
.page{position:relative;width:50%;height:100%;padding:calc(var(--top,24px) + 40px) var(--pad) calc(var(--bot,16px) + 20px);
  display:flex;flex-direction:column;overflow:hidden}
#veil{position:absolute;inset:0;background:var(--bg);opacity:0;pointer-events:none;z-index:4}

/* press feedback */
.app,.chip,.btn,.row,.ev,.dk,.ra,.tile,.sg,.mi,#dots button{transition:transform .22s var(--ease),opacity .22s,background-color .2s}
.app:active,.row:active,.ev:active,.ra:active,.mi:active{opacity:.55;transform:scale(.97)}
.chip:active,.btn:active,.dk:active,.sg:active,.tile:active{transform:scale(.95)}
.pressing{transform:scale(.95)!important;opacity:.7}

/* home */
.clockrow{display:flex;justify-content:space-between;align-items:flex-end;padding-right:28px}
#clock{margin:0;font-weight:200;font-size:56px;line-height:1;letter-spacing:-2px}
.cols{margin-top:30px;padding-right:28px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:14px}
.col{display:flex;flex-direction:column;min-width:0}
.col .mono{margin:0 0 6px}
.app{min-height:54px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:300;font-size:calc(24px * var(--fs,1));letter-spacing:-.7px}
.app.missing{color:var(--ink2);text-decoration:line-through;text-decoration-thickness:1px}
#plainList{margin-top:24px;padding-right:28px;flex:1;min-height:0;padding-bottom:60px}
#plainList .app{font-size:calc(22px * var(--fs,1));min-height:50px}
.letter{margin:16px 0 2px}
#rail{position:absolute;right:0;padding-right:6px;touch-action:none;z-index:3;top:calc(var(--top,24px) + 128px);bottom:calc(var(--bot,16px) + 76px);width:40px;
  display:flex;flex-direction:column;justify-content:flex-start;align-items:center}
#rail button{width:34px;flex:0 1 23px;min-height:14px;max-height:24px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;color:var(--ink2);text-align:center;transition:transform .2s var(--pop),color .14s}
#rail button.on{color:var(--ink);font-weight:600;transform:translateX(-12px) scale(1.6)}
#rail button.off{opacity:.35}

/* page dots */
#app.shellish #dots{background:rgba(10,10,10,.6)}
#app.shellish #dots button{color:rgba(245,243,239,.45)}
#app.shellish #dots button.on{color:#f5f3ef}
#dots{position:absolute;left:50%;bottom:calc(var(--bot,16px) + 18px);transform:translateX(-50%);z-index:6;display:flex;gap:2px;padding:4px 8px;
  border-radius:999px;background:rgba(var(--inkRGB),.06);touch-action:none}
#dots button{width:34px;height:30px;display:flex;align-items:center;justify-content:center;color:rgba(var(--inkRGB),.3)}
#dots button.on{color:var(--ink);transform:scale(1.15)}
#dots .pip{width:7px;height:7px;border-radius:50%;background:currentColor}

/* folders (App Library) */
.fsearch{display:flex;align-items:center;gap:10px;min-height:46px;padding:0 16px;border-radius:14px;background:rgba(var(--inkRGB),.07);flex-shrink:0}
#fq{all:unset;flex:1;min-width:0;font-size:17px;color:var(--ink);-webkit-user-select:text;user-select:text}
#fq::placeholder{color:var(--ink2)}
.tiles{margin-top:14px;flex:1;min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-content:start;padding-bottom:70px}
.tile{min-height:148px;padding:14px 16px;border-radius:24px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.06);
  display:flex;flex-direction:column;justify-content:space-between;text-align:left;overflow:hidden}
.tapps{display:flex;flex-direction:column;gap:3px;min-width:0}
.tapps>span:not(.mono){font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tapps .tempty{color:var(--ink2)}
.tname{font-weight:300;font-size:calc(26px * var(--fs,1));letter-spacing:-.8px}
.flist{margin-top:14px;flex:1;min-height:0}
#fwrap{position:absolute;inset:0;z-index:7;display:none;--fb:0}
#fwrap.on{display:block}
#fscrim{position:absolute;inset:0;background:rgba(var(--bgRGB),.55);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);opacity:var(--fb)}
#fview{position:absolute;left:18px;right:18px;top:calc(var(--top,24px) + 110px);max-height:calc(100% - 200px);display:flex;flex-direction:column;
  background:var(--pop);border-radius:30px;padding:22px 20px 10px;box-shadow:0 30px 70px rgba(0,0,0,.18);transform-origin:0 0;will-change:transform}
.fhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.fname{font-weight:300;font-size:34px;letter-spacing:-1.2px}
.fbody{min-height:0}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:14px}
/* icons line up with the folder's name on the left and its count on the right */
.ficons{display:grid;grid-template-columns:repeat(4,60px);justify-content:space-between;gap:16px 0;padding:4px 0 16px}
.fi{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0;text-align:center;transition:transform .22s var(--ease),opacity .22s}
.fi:active{transform:scale(.9);opacity:.75}
.fic{position:relative;width:60px;height:60px;border-radius:17px;overflow:hidden;background:var(--soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 0 0 .5px rgba(var(--inkRGB),.12),0 3px 10px rgba(0,0,0,.1)}
.fic b{font-weight:400;font-size:24px;color:var(--ink2)}
.fic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fic.add{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2);color:var(--ink2)}
.fil{font-size:12.5px;line-height:1.2;width:78px;margin:0 -9px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#liftItem.fi{padding:0;background:none;border-radius:0;flex-direction:column;align-items:center;transform-origin:50% 40%}
#liftItem.fi .fil{color:var(--ink)}
.chip{min-height:48px;padding:0 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}

/* overlays */
.over{position:absolute;inset:0;padding:calc(var(--top,24px) + 36px) 18px calc(var(--bot,16px) + 18px);display:flex;flex-direction:column;z-index:5;visibility:hidden;will-change:transform}
.over h1{margin:0 10px 12px;font-size:40px}

/* calendar (Today view) */
.calhead{display:flex;justify-content:space-between;align-items:flex-end;padding:0 10px 12px}
.calhead h1{margin:0;font-size:40px}
.days{flex:1;min-height:0;padding-bottom:80px}
.card.row1{flex-direction:row;justify-content:space-between;align-items:center;padding:16px 18px}
.card .sub{font-size:15px;color:var(--ink2)}
.ev{min-height:46px;display:flex;align-items:center;gap:12px;width:100%}
.ev .t{width:48px;flex-shrink:0;font-family:var(--mono);font-size:13px}
.ev .n{display:flex;flex-direction:column;min-width:0}
.ev .nt{font-size:17px;font-weight:500;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .nl{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-left:auto}
.freeline{margin:4px 10px 0;font-size:14px;color:var(--ink2)}
.fab{position:absolute;right:28px;bottom:calc(var(--bot,16px) + 26px);width:56px;height:56px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 26px rgba(0,0,0,.22)}
.ask{gap:14px;font-size:16px;line-height:1.45}

/* search (Spotlight) */
.qwrap{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 16px;border-radius:16px;flex-shrink:0}
#q{all:unset;flex:1;min-width:0;font-size:18px;color:var(--ink);-webkit-user-select:text;user-select:text}
#q::placeholder{color:var(--ink2)}
#results{margin-top:14px;flex:1;min-height:0}
.sug{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:4px}
.sg{min-height:52px;padding:0 6px;border-radius:14px;background:var(--chipGlass);font-size:14px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{width:100%;min-height:52px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line)}
.card .row:first-of-type{border-top:0}
.card>.mono+.row{border-top:0}
.row .l{font-size:17px;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{flex-shrink:0}
.row.best .l{font-weight:500}
.flist .row{padding:0 4px}
.hint{margin:8px 10px 0;font-size:14px;line-height:1.5;color:var(--ink2)}
.btn{min-height:46px;padding:0 18px;border-radius:999px;border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-size:15px;white-space:nowrap}
.btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{min-height:42px;padding:0 16px;font-size:14px}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* now */
.nowlist{flex:1;min-height:0}
.hrow{flex-direction:row;justify-content:space-between;align-items:center;gap:12px}
.card .col{display:flex;flex-direction:column;gap:3px;min-width:0;width:100%;text-align:left}
.ti{font-size:18px;font-weight:500;letter-spacing:-.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx{font-size:15px;color:var(--ink2);line-height:1.35}
.tx.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{font-size:17px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ctl{display:flex;gap:2px;flex-shrink:0;align-items:center}
.ib{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ib.solid{background:var(--ink)}
.bar{height:3px;border-radius:2px;background:var(--line);margin-top:6px}
.bar>i{display:block;height:3px;border-radius:2px;background:var(--acc)}
.reply{display:flex;gap:8px;margin-top:6px}
.reply input{flex:1;min-width:0;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:var(--card);font-size:15px;outline:none}
.card .btnrow{margin-top:6px}
.dock{margin-top:10px;border-radius:26px;padding:10px 6px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.dk{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:64px;justify-content:center;text-align:center}
.di{display:flex;color:var(--ink)}
.dl{font-family:var(--mono);font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink2)}

.ncard{padding:0;will-change:transform}
.ncard .msg{padding:14px 18px;gap:4px}
/* the player */
.mcard{position:relative;overflow:hidden;padding:16px 16px 10px;gap:12px}
.mbg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(36px) saturate(1.5);opacity:.32;pointer-events:none}
.mcard>*:not(.mbg){position:relative}
.mtop{display:flex;align-items:center;gap:14px;min-width:0}
.mart{width:72px;height:72px;border-radius:14px;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--ink2);
  box-shadow:0 8px 22px rgba(0,0,0,.22),0 0 0 .5px rgba(var(--inkRGB),.12);transition:transform .25s var(--ease)}
.mart:active{transform:scale(.94)}
.mart img{width:100%;height:100%;object-fit:cover}
.mart .fic{width:100%;height:100%;border-radius:0;box-shadow:none}
.mcard .ti{font-size:19px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.2}
.mcard .mono{display:flex;align-items:center;gap:6px}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:10px}
.eq b{width:2px;background:var(--acc);border-radius:1px;animation:eq 1s ease-in-out infinite}
.eq b:nth-child(2){animation-delay:-.35s}.eq b:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{height:3px}50%{height:10px}}
.seek{padding:8px 0 0;touch-action:none;cursor:pointer}
.strack{position:relative;height:5px;border-radius:3px;background:rgba(var(--inkRGB),.14);transition:height .2s var(--ease)}
.sfill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--ink)}
.sknob{position:absolute;top:50%;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.25);transform:scale(.0);transition:transform .2s var(--pop)}
.mcard.seeking .strack{height:9px}
.mcard.seeking .sknob,.seek:hover .sknob{transform:scale(1)}
.mcard.seeking .sknob{transform:scale(1.5)}
.stimes{display:flex;justify-content:space-between;margin-top:7px;font-size:10.5px;font-variant-numeric:tabular-nums}
.mctl{display:flex;align-items:center;justify-content:center;gap:30px;padding:2px 0 4px}
.mb{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);transition:transform .2s var(--pop),background-color .2s}
.mb:active{transform:scale(.86);background:var(--soft)}
.mb.play{width:66px;height:66px;background:var(--ink);box-shadow:0 8px 22px rgba(0,0,0,.2)}
.mb.play:active{transform:scale(.9);background:var(--ink)}

/* hold: lift + menu */
#lift{position:absolute;inset:0;z-index:8;display:none}
#lift.on{display:block}
#lift::before{content:"";position:absolute;inset:0;background:rgba(var(--bgRGB),.35);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);animation:fadeIn .28s var(--ease) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes liftIn{from{transform:scale(1);box-shadow:0 0 0 rgba(0,0,0,0)}to{transform:scale(1.06);box-shadow:0 18px 40px rgba(0,0,0,.18)}}
@keyframes menuIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
#liftItem{position:absolute;display:flex;align-items:center;padding:6px 14px;border-radius:18px;background:var(--pop);white-space:nowrap;
  transform-origin:12% 50%;animation:liftIn .42s var(--pop) both}
#liftMenu{position:absolute;width:250px;border-radius:16px;overflow:hidden;background:var(--pop);
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 18px 50px rgba(0,0,0,.2);animation:menuIn .42s var(--pop) both}
.mi{width:100%;min-height:50px;padding:0 16px;display:flex;justify-content:space-between;align-items:center;font-size:16px;border-top:1px solid var(--line)}
.mi:first-child{border-top:0}
.mi.red{color:var(--red)}
.mi .mn{font-size:13px;color:var(--ink2)}

/* sheets */
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.34);opacity:0;pointer-events:none;z-index:9;display:none}
#scrim.on{display:block;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:var(--sheet);border-radius:28px 28px 0 0;z-index:10;display:none;
  padding:12px var(--pad) calc(var(--bot,16px) + 22px);flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.1);will-change:transform}
#sheet.on{display:flex}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line2);align-self:center;margin-bottom:14px;flex-shrink:0;padding:8px 40px;background-clip:content-box;box-sizing:content-box;margin-top:-8px}
#sheet .sbody{overflow-y:auto;min-height:0;scrollbar-width:none;touch-action:pan-y}
#sheet h2{margin:0 0 6px;font-weight:300;font-size:30px;letter-spacing:-1px}
#sheet .grp{margin-top:20px}
#sheet .grp>.mono{margin:0 0 6px}
#sheet .hint{margin:16px 0 0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;border-top:1px solid var(--line)}
.kv:last-child{border-bottom:1px solid var(--line)}
.kv .k{font-size:17px}
.kv .v{font-size:14px;color:var(--ink2)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pick{width:100%;min-height:50px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);font-size:17px}
.pick .ck{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background-color .2s,border-color .2s}
.pick.on .ck{background:var(--ink);border-color:var(--ink)}
.status{margin-top:10px;font-size:14px;line-height:1.45;color:var(--ink2);min-height:20px}
.namein{width:100%;min-height:50px;padding:0 16px;border-radius:14px;border:1px solid var(--line2);background:transparent;font-size:17px;outline:none}

#toast{position:absolute;left:50%;top:calc(var(--top,24px) + 10px);transform:translateX(-50%) translateY(-16px) scale(.9);opacity:0;z-index:20;
  padding:12px 20px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:14px;white-space:nowrap;pointer-events:none;transition:transform .45s var(--pop),opacity .25s}
#toast.on{opacity:1;transform:translateX(-50%)}

/* A–Z rail card */
#railPop{position:absolute;right:48px;top:120px;width:min(250px,64vw);max-height:330px;background:rgba(var(--inkRGB),.92);color:var(--bg);border-radius:22px;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  padding:14px 8px 8px 18px;z-index:8;display:flex;flex-direction:column;opacity:0;pointer-events:none;
  transform:translate3d(16px,0,0) scale(.9);transform-origin:100% 30%;
  transition:opacity .18s,transform .38s var(--pop),top .2s var(--ease);box-shadow:0 18px 50px rgba(0,0,0,.25)}
#railPop.on{opacity:1;pointer-events:auto;transform:none}
#railPop .rl{margin:0 0 4px;font-weight:200;font-size:44px;line-height:1;letter-spacing:-1px}
#railPop .rlist{min-height:0;overflow-y:auto;padding-right:10px}
#railPop .ra{display:flex;align-items:center;width:100%;min-height:44px;font-size:18px;font-weight:300;letter-spacing:-.3px;border-top:1px solid rgba(var(--bgRGB),.14);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#railPop .rnone{margin:6px 0 10px;font-size:15px;color:rgba(var(--bgRGB),.65)}

/* a pattern is on: give the words on the wall a soft halo of the background so they stay easy to read */
#app.patterned .page .app,#app.patterned #clock,#app.patterned .page>.clockrow .mono,#app.patterned .col>.mono,#app.patterned .over h1,#app.patterned .calhead .mono,#app.patterned #rail button,#app.patterned .letter{text-shadow:0 0 2px var(--bg),0 0 8px var(--bg),0 0 16px var(--bg),0 0 24px var(--bg)}

/* app icons beside names on Home */
.app .an{min-width:0;overflow:hidden;text-overflow:ellipsis}
.hic{flex:none;display:flex;margin-right:12px}
.hic .fic{width:26px;height:26px;border-radius:7.5px;box-shadow:0 0 0 .5px rgba(var(--inkRGB),.14)}
.hic .fic b{font-size:12px}
.hic.tint img{filter:url(#duo)}
.hic.tint .fic{background:rgba(var(--inkRGB),.1)}
#app.withicons .page .app{font-size:calc(21px * var(--fs,1));letter-spacing:-.5px}
/* folder icons */
.ficon{flex:none;display:inline-flex;align-items:center;justify-content:center}
.tname{display:flex;align-items:center;gap:9px;min-width:0}
.tname>span:last-child,.fname>span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fname{display:flex;align-items:center;gap:11px;min-width:0}
.fihead{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fpal{display:flex;flex-wrap:wrap;gap:12px}
.fsw{width:36px;height:36px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);transition:transform .2s var(--pop)}
.fsw.on{box-shadow:0 0 0 2px var(--sheet),0 0 0 4px var(--ink)}
.fgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.fg{aspect-ratio:1;border-radius:16px;background:var(--soft);display:flex;align-items:center;justify-content:center;transition:transform .2s var(--pop)}
.fg:active,.fsw:active{transform:scale(.9)}
.fg.on{background:var(--card);box-shadow:0 0 0 2px var(--ink)}
/* SHELL layout */
#lhead{display:none;margin:0;font-size:11px;line-height:1.75;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink)}
#lhead p{margin:0}
#lhead .gap{margin-top:14px}
#app.ledger .clockrow{align-items:flex-start;padding-right:0}
#app.ledger #lhead{display:block}
#app.ledger #date{display:none}
#app.ledger #clock{font-family:Inter,system-ui,sans-serif;font-weight:100;font-size:96px;line-height:.92;letter-spacing:-3px;text-align:right;margin-top:-6px}
#app.ledger .page .app,#app.ledger.withicons .page .app{font-family:var(--mono);font-weight:400;font-size:16px;letter-spacing:.2px;min-height:46px}
#app.ledger .hic{margin-right:11px}
#app.ledger .hic .fic{width:20px;height:20px;border-radius:5.5px}
#app.ledger .col>.mono{letter-spacing:1.2px}
#app.ledger #rail{top:calc(var(--top,24px) + 250px)}

/* themes folder */
.wxseg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wxseg .btn{padding:0 6px}
.swg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px}
.sw{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;transition:transform .22s var(--ease)}
.sw:active{transform:scale(.93)}
.swp{position:relative;width:100%;aspect-ratio:1;border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:300;font-size:20px;letter-spacing:-.5px;
  box-shadow:inset 0 0 0 1px rgba(128,128,128,.28);background-size:auto}
.swp i{position:absolute;right:9px;bottom:9px;width:9px;height:9px;border-radius:50%}
.sw.on .swp{outline:2.5px solid var(--ink);outline-offset:3px}
.swn{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sw.on .swn{color:var(--ink);font-weight:500}
.fsw{background:var(--soft);font-size:28px;font-weight:400;color:var(--ink)}

/* fun stuff folder + the full-screen toy */
.ftg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ft{min-height:58px;padding:8px 10px;border-radius:16px;background:var(--soft);font-size:15px;line-height:1.2;text-align:center;display:flex;align-items:center;justify-content:center;transition:transform .22s var(--ease)}
.ft:active{transform:scale(.94)}
#toy{position:absolute;inset:0;z-index:12;display:none;flex-direction:column;background-color:var(--bg);padding:calc(var(--top,24px) + 14px) 20px calc(var(--bot,16px) + 18px)}
#toy.on{display:flex;animation:rise .35s var(--ease) both}
.toyhead{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;min-height:52px;padding-left:6px}
#toyX{width:48px;height:48px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:300;line-height:1}
#toyBody{flex:1;min-height:0;position:relative}
.tbox{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.tpad{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;border-radius:26px;transition:background-color .2s}
.tcan{display:block;width:100%;flex:1;min-height:0;border-radius:22px;background:var(--soft);touch-action:none}
.tbig{font-weight:200;font-size:76px;letter-spacing:-3px;line-height:1;font-variant-numeric:tabular-nums}
.tmid{font-weight:300;font-size:30px;letter-spacing:-.8px;line-height:1.2;max-width:310px}
.tsub{font-size:14px;line-height:1.4;color:var(--ink2);max-width:300px}
.trow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;flex-shrink:0}
@keyframes flip{from{transform:rotateX(0)}to{transform:rotateX(1440deg)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-9px,3px) rotate(-5deg)}40%{transform:translate(8px,-3px) rotate(4deg)}60%{transform:translate(-6px,2px) rotate(-3deg)}80%{transform:translate(4px,0) rotate(2deg)}}
@keyframes popin{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.coin{width:170px;height:170px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:200;font-size:76px}
.coin.flip{animation:flip .6s var(--ease)}
.orb{width:230px;height:230px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;padding:34px;font-weight:300;font-size:24px;line-height:1.2;letter-spacing:-.4px}
.shake{animation:shake .5s ease}
.popin{animation:popin .35s var(--pop) both}
.die{width:74px;height:74px;border-radius:18px;border:1.5px solid var(--ink);padding:11px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);place-items:center}
.die i{width:10px;height:10px;border-radius:50%}
.die i.p{background:var(--ink)}
.bwg{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;width:100%;max-width:340px;touch-action:none}
.bw{aspect-ratio:1;border-radius:50%;background:var(--card);box-shadow:inset 0 -5px 9px rgba(var(--inkRGB),.16),inset 0 3px 5px rgba(255,255,255,.35),0 0 0 1px var(--line);transition:transform .16s var(--pop)}
.bw.x{background:transparent;box-shadow:inset 0 0 0 1px var(--line);transform:scale(.86)}
.g3,.g4{display:grid;gap:9px;width:100%;max-width:330px}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.tc{aspect-ratio:1;border-radius:18px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:300;font-size:30px;text-align:center;transition:background-color .15s,color .15s,transform .2s var(--pop)}
.tc.hot{background:var(--acc);color:var(--onAcc)}
.tc.inv{background:var(--ink);color:var(--bg)}
.tc.dim{opacity:.35}
.g4 .tc{font-size:24px;border-radius:15px}
.wh{position:relative;aspect-ratio:1;border-radius:50%;background:var(--soft)}
.wh.up::after{content:"";position:absolute;inset:16%;border-radius:50%;background:var(--acc);animation:popin .2s var(--pop) both}
.breath{width:150px;height:150px;border-radius:50%;background:var(--acc);opacity:.85;will-change:transform}
.pbar{width:100%;max-width:300px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--acc);border-radius:4px}
.tin{width:100%;max-width:320px;min-height:50px;padding:0 16px;border-radius:14px;border:1px solid var(--line2);background:transparent;font-size:17px;outline:none;text-align:center}

/* unfolded: calendar | home | folders side by side */
@media (min-width:760px){
  #cal{left:0;right:auto;width:32%;visibility:visible!important;transform:none!important;border-right:1px solid var(--line)}
  #stage{left:32%}
  #track{width:100%}
  #pHome{width:53%;border-right:1px solid var(--line);--pad:24px}
  #pFold{width:47%;--pad:20px}
  .app{font-size:22px}
  .clockrow,.cols{padding-right:40px}
  #search,#now{left:50%;right:auto;width:min(520px,100%);margin-left:-260px}
  #sheet{left:50%;right:auto;width:min(560px,100%);margin-left:-280px}
  #dots{display:none}
  #railPop{right:auto;left:calc(32% + 53% * .68 - 260px)}
  .ev .t{width:44px}
  .calhead h1{font-size:32px;white-space:nowrap}
  .calhead .mono{white-space:nowrap}
}

/* icon view (0.9.0): Home is a bare grid of icons, folder tiles preview their icons, an open folder shows big icons */
#app.gridview .cols{display:flex;flex-direction:column;column-gap:0;margin-top:44px}
#app.gridview .col>.mono{display:none}
#app.gridview #colPeople,#app.gridview #colThings{display:grid;grid-template-columns:repeat(4,64px);justify-content:space-between;row-gap:22px}
#app.gridview .col+.col{margin-top:24px;padding-top:24px;border-top:1px solid rgba(var(--inkRGB),.12)}
.gi .fic{width:64px;height:64px;border-radius:18px}
.gi .fic b{font-size:26px}
.gi .fil{display:none}
.gi.missing .fic{opacity:.35}
.gi.tint img,.tmini.tint img{filter:url(#duo)}
.gi.tint .fic,.tmini.tint .fic{background:rgba(var(--inkRGB),.1)}
#liftItem.fi .fil{display:block;margin:2px 0 0;padding:5px 10px;width:auto;max-width:150px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:12.5px}
#app.ledger #colPeople .gi,#app.ledger #colThings .gi{min-height:0}
.tile.tg{min-height:0;padding:12px;gap:12px;justify-content:flex-start}
.tmini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.tmini .fic{width:auto;height:auto;aspect-ratio:1;border-radius:9px;box-shadow:0 0 0 .5px rgba(var(--inkRGB),.12)}
.tmini .fic b{font-size:12px}
.tm{aspect-ratio:1;border-radius:9px;background:rgba(var(--inkRGB),.05)}
.tm.more{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--ink2);background:rgba(var(--inkRGB),.08)}
.tname.tgn{display:flex;align-items:center;gap:8px;padding:0 2px;font-weight:400;font-size:calc(17px * var(--fs,1));letter-spacing:-.3px;min-width:0}
.tgn>span:not(.ficon):not(.tc){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tgn .tc{font-size:11px;color:var(--ink2);letter-spacing:0}
#app.gridview .ficons{grid-template-columns:repeat(3,78px);gap:24px 0}
#app.gridview .ficons .fic{width:78px;height:78px;border-radius:22px}
#app.gridview .ficons .fic b{font-size:30px}
#app.gridview .ficons .fil{width:96px;margin:0 -9px}

/* grid with names (0.9.1): a normal icon grid, each app named underneath */
#app.gnames .gi .fil{display:block;font-size:12px;width:80px;margin:0 -8px}
#app.gnames #colPeople,#app.gnames #colThings{row-gap:16px}
#app.gnames .gi{gap:6px}
#app.gnames.ledger .gi .fil{font-family:var(--mono);font-size:10.5px}
#app.gnames #liftItem.fi .fil{background:none;color:var(--ink);padding:0;font-size:12px}

[hidden]{display:none!important}
/* grid + dock (0.10.0): one free grid you arrange by dragging, a dock of up to 5 at the thumb */
#gfree{margin-top:44px;margin-left:-10px;padding-left:10px;padding-right:28px;flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,64px);justify-content:space-between;align-content:start;row-gap:22px;padding-bottom:150px}
#app.gnames #gfree{row-gap:16px}
#hdock{position:absolute;left:14px;right:14px;bottom:calc(var(--bot,16px) + 66px);height:88px;border-radius:30px;padding:0 14px;z-index:2;
  display:flex;align-items:center;justify-content:space-around;background:rgba(var(--inkRGB),.07);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#app.shellish #hdock{background:rgba(10,10,10,.5)}
#hdock .gi .fil{display:none!important}
#hdock .gi .fic{width:60px;height:60px;border-radius:17px}
#app.docked #rail{bottom:calc(var(--bot,16px) + 166px)}
.gi.dragging{visibility:hidden}
#dragGhost{position:absolute;z-index:20;pointer-events:none;transition:transform .2s var(--pop),left .24s var(--ease),top .24s var(--ease)}
#dragGhost.up{transform:scale(1.12);transition:transform .2s var(--pop)}
#dragGhost .gi{display:block;padding:0}
#dragGhost .fil{display:none!important}
#dragGhost .fic{width:64px;height:64px;border-radius:18px;box-shadow:0 14px 30px rgba(0,0,0,.25)}
#app.arranging #gfree .gi,#app.arranging #hdock .gi{transition:transform .22s var(--ease)}

/* folder cards (0.11.0, R3): apps right in the card, 4 big icons a page, swipe for more */
.fcards{margin-top:14px;flex:1;min-height:0;overflow:clip;touch-action:none;margin-bottom:56px;
  -webkit-mask-image:linear-gradient(#000 calc(100% - 22px),transparent);mask-image:linear-gradient(#000 calc(100% - 22px),transparent)}
.fcol{display:flex;flex-direction:column;gap:12px;will-change:transform}
.fcard{flex:none;background:var(--card);border-radius:26px;padding:6px 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.06);overflow:hidden}
.fch{width:100%;display:flex;align-items:center;gap:9px;min-height:44px;padding:0 18px;text-align:left}
.fcn{flex:1;min-width:0;font-weight:400;font-size:calc(19px * var(--fs,1));letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcc{font-size:11px;color:var(--ink2)}
.fstrip{overflow:hidden;touch-action:pan-y}
.fpages{display:flex;will-change:transform}
.fpg{flex:none;width:100%;box-sizing:border-box;padding:4px 14px 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));justify-items:center;row-gap:12px}
.fb{gap:7px}
.fb .fic{width:66px;height:66px;border-radius:19px}
.fb .fic b{font-size:27px}
.fb .fil{font-size:12px;width:78px;margin:0}
.fpages.tint img{filter:url(#duo)}
.fpages.tint .fic{background:rgba(var(--inkRGB),.1)}
.fdots{display:flex;justify-content:center;gap:5px;margin-top:10px}
.fdots i{width:5px;height:5px;border-radius:3px;background:rgba(var(--inkRGB),.2);transition:width .25s var(--ease),background-color .25s}
.fdots i.on{width:14px;background:var(--ink)}
.fempty{margin:4px 18px 4px}
#app.ledger .fcn{font-family:var(--mono);font-size:15px}
#app.ledger .fb .fil{font-family:var(--mono);font-size:10.5px}

/* folder sections (0.12.0): little vertical dots on the right edge */
#pFold{position:relative}
#fsecdots{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:5px;z-index:2;pointer-events:none}
#fsecdots i{width:5px;height:5px;border-radius:3px;background:rgba(var(--inkRGB),.2);transition:height .25s var(--ease),background-color .25s}
#fsecdots i.on{height:14px;background:var(--ink)}
</style>
</head>
<body>
<div id="app">
  <div id="wall"></div><div id="wallOld"></div><canvas id="wx" aria-hidden="true"></canvas><div id="bolt"></div>
  <div id="stage">
    <div id="track">
      <section class="page" id="pHome" aria-label="Home">
        <div class="clockrow">
          <div class="mono" id="lhead"></div>
          <p id="clock" role="button" aria-label="Time. Hold for settings"></p>
          <p class="mono" id="date" style="margin:0"></p>
        </div>
        <div class="cols" id="cols">
          <nav class="col" aria-label="People apps"><p class="mono">People</p><div id="colPeople"></div></nav>
          <nav class="col" aria-label="Things apps"><p class="mono">Things</p><div id="colThings"></div></nav>
        </div>
        <nav class="scroll" id="gfree" aria-label="Home apps" hidden></nav>
        <div class="scroll" id="plainList" hidden></div>
        <nav id="hdock" aria-label="Dock" hidden></nav>
        <nav id="rail" aria-label="Alphabet"></nav>
      </section>

      <section class="page" id="pFold" aria-label="Folders">
        <label class="fsearch"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" style="stroke:var(--ink2)" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <span class="sr">Search folders and apps</span><input id="fq" type="search" placeholder="Folders" autocomplete="off" spellcheck="false"></label>
        <div class="tiles scroll" id="tiles"></div>
        <div id="fsecdots" aria-hidden="true"></div>
      </section>
    </div>
  </div>
  <div id="veil"></div>

  <section class="over" id="cal" aria-label="Calendar">
    <div class="calhead"><h1>Next 7 days</h1><span class="mono" id="calCount"></span></div>
    <div class="days scroll" id="days"></div>
    <button class="fab" id="addEv" aria-label="Add event"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" style="stroke:var(--onAcc)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </section>

  <div id="dots" role="tablist" aria-label="Pages">
    <button data-dot="-1" role="tab" aria-label="Calendar"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="1" y="1.5" width="8" height="7.5" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <button data-dot="0" role="tab" aria-label="Home"><span class="pip"></span></button>
    <button data-dot="1" role="tab" aria-label="Folders"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x=".5" y=".5" width="3.8" height="3.8" rx="1" fill="currentColor"/><rect x="5.7" y=".5" width="3.8" height="3.8" rx="1" fill="currentColor"/><rect x=".5" y="5.7" width="3.8" height="3.8" rx="1" fill="currentColor"/><rect x="5.7" y="5.7" width="3.8" height="3.8" rx="1" fill="currentColor"/></svg></button>
  </div>

  <section class="over" id="search" aria-label="Search">
    <label class="qwrap glass"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="stroke:var(--ink2)" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span class="sr">Search</span><input id="q" type="text" placeholder="Search" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go"></label>
    <div id="results" class="scroll"></div>
  </section>

  <section class="over" id="now" aria-label="Now">
    <h1>Now</h1>
    <div class="nowlist scroll" id="nowlist"></div>
    <div class="dock glass" id="dock"></div>
  </section>

  <div id="fwrap"><div id="fscrim"></div><div id="fview" role="dialog" aria-modal="true"></div></div>
  <div id="railPop" aria-live="polite"></div>
  <div id="lift"></div>

  <div id="scrim"></div>

  // The Folders page moves in sections, not a free scroll: as many cards as fit the screen, and a swipe up/down
  // springs to the next set (0.12.0). FSEC.k = section, FSEC.pos = fractional position while dragging.
  const FSEC = { n: 0, k: 0, pos: 0, starts: [0] };
  function measureSections() {
    const box = $('#tiles'), col = box.querySelector('.fcol');
    if (!col) { FSEC.n = 0; return; }
    const h = box.clientHeight, cards = [...col.children], starts = [0];
    cards.forEach((c) => { const top = c.offsetTop, bottom = top + c.offsetHeight; if (bottom - starts[starts.length - 1] > h + 1 && top > starts[starts.length - 1]) starts.push(top); });
    FSEC.starts = starts; FSEC.n = starts.length; FSEC.k = Math.min(FSEC.k, FSEC.n - 1);
    col.style.paddingBottom = Math.max(0, h - (col.scrollHeight - starts[starts.length - 1])) + 'px';
    $('#fsecdots').innerHTML = FSEC.n > 1 ? starts.map(() => '<i></i>').join('') : '';
    setSection(FSEC.k);
  }
  function secOffset(pos) {   // fractional section → px
    const s = FSEC.starts, i = Math.max(0, Math.min(s.length - 1, Math.floor(pos))), f = pos - i;
    if (pos < 0) return pos * 120;   // rubber band past the ends
    if (pos > s.length - 1) return s[s.length - 1] + (pos - s.length + 1) * 120;
    return s[i] + (i + 1 < s.length ? (s[i + 1] - s[i]) * f : 0);
  }
  function setSection(pos) {
    FSEC.pos = pos;
    const col = $('#tiles .fcol'); if (!col) return;
    col.style.transform = 'translate3d(0,' + (-secOffset(pos)) + 'px,0)';
    const k = Math.round(Math.max(0, Math.min(FSEC.n - 1, pos)));
    $('#fsecdots').querySelectorAll('i').forEach((d, j) => d.classList.toggle('on', j === k));
  }
  function goSection(t, v) {
    t = Math.max(0, Math.min(FSEC.n - 1, t));
    if (t !== FSEC.k) haptic('tick');

    spring('fsec', FSEC.pos, t, v || 0, { response: 0.5, damping: 0.86, eps: 0.0005 }, setSection);
  }
  window.addEventListener('resize', () => { if (FSEC.n || $('#tiles .fcol')) measureSections(); });

      const v = J(data, data);
      switch (type) {
        case 'back': if (toyOpen) closeToy(); else if (liftOpen) closeLift(); else if (railPinned) closeRail(); else if (sheetOpen) closeSheet(); else if (folderOpen >= 0) closeFolder(); else if (over) setOver(''); else goPage(0); break;
        case 'home': closeToy(true); closeRail(); if (hxTarget === 0 && !over && !sheetOpen && folderOpen < 0) staggerHome(); goHome(); break;
        case 'apps': loadApps(); renderHome(); if (folderOpen < 0) renderFolders(); break;
        case 'resume': sunTick(); renderClock(); loadEvents(); renderCal(); if (over === 'now') renderNow(); if (sheetKind === 'settings') openSettings(); break;
        case 'perms': loadEvents(); renderCal(); if (over === 'now') renderNow(); if (sheetKind === 'settings') openSettings(); break;
        case 'notifs': case 'media': if (over === 'now' && !(G && G.notif)) renderNow(); break;
        case 'update': onUpdate(v); break;
      }
    },
    bars() { return themeBars; },
    // For the automated checks (src/check.js).
    state() { return { hx, hxTarget, tS, tN, over, sheet: sheetOpen, lift: liftOpen, folder: folderOpen, rail: railPop.classList.contains('on'), springs: running.size, toy: toyOpen, kind: sheetKind, theme: Object.assign({}, S.theme), fsec: { n: FSEC.n, k: FSEC.k } }; },
    themes() { return TH.map((c) => { const d = derive(c); return { id: c.id, n: c.n, g: c.g, ink: +d.inkMin.toFixed(2), ink2: +d.ink2Min.toFixed(2) }; }); },
    patterns() { return PATS.map((x) => x[0]); },
    toys() { return TOYS.map((t) => t[0]); },
    setTheme, openToy, closeToy, sunPhase, sunTimes, weather() { return { kind: wxKind, drops: wxDrops.length, running: !!wxRaf }; }
  };

  // ------------------------------------------------------------------ start
  if (N.__mock) document.documentElement.style.setProperty('--top', '24px');
  else { document.documentElement.style.setProperty('--top', '0px'); document.documentElement.style.setProperty('--bot', '0px'); }
  // Nothing may scroll the frame itself (focus or scroll-into-view would shift every page under the finger).
  ['#app', '#stage', '#pHome', '#pFold'].forEach((sel) => { const el = $(sel); el.addEventListener('scroll', () => { if (el.scrollLeft || el.scrollTop) { el.scrollLeft = 0; el.scrollTop = 0; } }); });
  applyTheme(false); applyWeather();
  loadApps(); loadEvents();
  renderHome(); renderCal(); renderFolders(); renderNow();
  paint();
  requestAnimationFrame(() => staggerHome());
  setInterval(renderClock, 10000);
  setInterval(sunTick, 60000);
  window.addEventListener('resize', paint);
  call('ready');
})();
