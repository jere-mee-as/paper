<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,interactive-widget=resizes-content">
<meta name="color-scheme" content="light">
<title>Paper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#ECE9E2; --ink:#171614; --ink2:#5F5B54; --line:rgba(23,22,20,.16); --line2:rgba(23,22,20,.3);
  --acc:#C4551F; --sheet:#F5F3EE;
  --mono:'IBM Plex Mono',ui-monospace,'Roboto Mono',monospace;
  --sans:Inter,system-ui,'Roboto',sans-serif;
  --pad:28px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
input{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink2)}
h1{margin:0;font-weight:300;font-size:42px;line-height:1.05;letter-spacing:-1.6px}

#app{position:fixed;inset:0;overflow:hidden;touch-action:none}
#track{position:absolute;top:0;left:0;height:100%;width:300%;display:flex;transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.page{position:relative;width:33.3334%;height:100%;padding:calc(var(--top,24px) + 40px) var(--pad) calc(var(--bot,16px) + 20px);
  display:flex;flex-direction:column;overflow:hidden}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}

/* home */
.clockrow{display:flex;justify-content:space-between;align-items:flex-end;padding-right:28px}
#clock{margin:0;font-weight:200;font-size:56px;line-height:1;letter-spacing:-2px}
.cols{margin-top:30px;padding-right:28px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:14px}
.col{display:flex;flex-direction:column;min-width:0}
.col .mono{margin:0 0 6px}
.app{min-height:54px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-weight:300;font-size:24px;letter-spacing:-.7px}
.app.missing{color:var(--ink2);text-decoration:line-through;text-decoration-thickness:1px}
.app:active,.row:active,.fold-h:active{opacity:.5}
#plainList{margin-top:24px;padding-right:28px;flex:1;min-height:0}
#plainList .app{font-size:22px;min-height:50px}
.letter{margin:16px 0 2px}
#rail{position:absolute;right:6px;top:calc(var(--top,24px) + 128px);bottom:calc(var(--bot,16px) + 30px);width:34px;
  display:flex;flex-direction:column;justify-content:flex-start;align-items:center}
#rail button{width:34px;flex:0 1 23px;min-height:16px;max-height:24px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;color:var(--ink2);text-align:center}
#rail button.on{color:var(--ink);font-weight:500}
#rail button.off{opacity:.35}

/* calendar */
.days{margin-top:18px;flex:1;min-height:0}
.day{border-top:1px solid var(--line);padding:6px 0;display:flex;gap:14px}
.day:last-child{border-bottom:1px solid var(--line)}
.dlab{width:62px;flex-shrink:0;min-height:44px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.dnum{font-weight:300;font-size:22px;line-height:1;letter-spacing:-.6px}
.evs{flex:1;min-width:0;display:flex;flex-direction:column}
.ev{min-height:44px;display:flex;align-items:center;gap:12px;width:100%}
.ev .t{width:52px;flex-shrink:0;font-family:var(--mono);font-size:13px}
.ev .n{min-width:0;font-size:17px;font-weight:500;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-left:auto}
.free{min-height:44px;display:flex;align-items:center;font-size:15px;color:var(--ink2)}
.fab{width:56px;height:56px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.calfoot{margin-top:14px;display:flex;justify-content:flex-end}
.ask{margin-top:24px;display:flex;flex-direction:column;gap:12px;font-size:16px;line-height:1.45}

/* folders */
.folds{margin-top:20px;flex:1;min-height:0}
.fold{border-top:1px solid var(--line)}
.fold:last-child{border-bottom:1px solid var(--line)}
.fold-h{width:100%;min-height:56px;display:flex;justify-content:space-between;align-items:center}
.fold-h .nm{font-weight:300;font-size:30px;letter-spacing:-1px}
.fold-h .sg{font-weight:300;font-size:26px;color:var(--ink2)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:14px}
.chip{min-height:46px;padding:0 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:16px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}

/* overlays */
.over{position:absolute;inset:0;background:var(--bg);padding:calc(var(--top,24px) + 40px) var(--pad) calc(var(--bot,16px) + 20px);
  display:flex;flex-direction:column;transition:transform .26s cubic-bezier(.2,.8,.2,1);z-index:5}
#search{transform:translateY(-100%)}
#now{transform:translateY(100%)}
.over.open{transform:none!important}
.qwrap{display:flex;align-items:baseline;gap:4px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
#q{all:unset;flex:1;min-width:0;font-weight:300;font-size:30px;letter-spacing:-1px;color:var(--ink);-webkit-user-select:text;user-select:text}
#q::placeholder{color:var(--ink2)}
#results{margin-top:18px;flex:1;min-height:0}
.row{width:100%;min-height:56px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line)}
.row:last-child{border-bottom:1px solid var(--line)}
.row .l{font-size:19px;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{flex-shrink:0}
.row.best .l{font-weight:500}
.card{background:var(--ink);color:var(--bg);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;margin-bottom:14px}
.card .mono{color:#B5B1A9}
.card .big{font-size:24px;font-weight:500;letter-spacing:-.5px}
.card .sub{font-size:15px;line-height:1.4;color:#B5B1A9}
.btn{min-height:48px;padding:0 18px;border-radius:999px;border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;font-size:15px;white-space:nowrap}
.btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card .btn.solid{background:var(--bg);color:var(--ink);border-color:var(--bg);font-weight:500}
.card .btn{border-color:rgba(236,233,226,.25);color:var(--bg)}
.btn.sm{min-height:44px;padding:0 16px;font-size:14px}
.btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hint{margin:16px 0 0;font-size:15px;line-height:1.5;color:var(--ink2)}

/* now */
.nowlist{margin-top:20px;flex:1;min-height:0}
.sec{border-top:1px solid var(--line);padding:16px 0 18px;display:flex;flex-direction:column;gap:12px}
.sec:last-child{border-bottom:1px solid var(--line)}
.sec .hd{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sec .ti{font-size:19px;font-weight:500;letter-spacing:-.3px;overflow:hidden;text-overflow:ellipsis}
.sec .tx{font-size:15px;color:var(--ink2);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ctl{display:flex;gap:2px;flex-shrink:0}
.ib{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ib.solid{background:var(--ink)}
.bar{height:3px;border-radius:2px;background:var(--line)}
.bar>i{display:block;height:3px;border-radius:2px;background:var(--acc)}
.reply{display:flex;gap:8px}
.reply input{flex:1;min-width:0;min-height:46px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:transparent;font-size:15px;outline:none}
.toggles{margin-top:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.toggles .btn{padding:0 6px;font-size:14px}

/* sheets */
#scrim{position:absolute;inset:0;background:rgba(23,22,20,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:var(--sheet);border-radius:28px 28px 0 0;z-index:10;
  padding:12px var(--pad) calc(var(--bot,16px) + 22px);transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;touch-action:pan-y}
#sheet.on{transform:none}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line2);align-self:center;margin-bottom:14px;flex-shrink:0}
#sheet .sbody{overflow-y:auto;min-height:0;scrollbar-width:none}
#sheet h2{margin:0 0 6px;font-weight:300;font-size:30px;letter-spacing:-1px}
#sheet .grp{margin-top:20px}
#sheet .grp>.mono{margin:0 0 6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;border-top:1px solid var(--line)}
.kv:last-child{border-bottom:1px solid var(--line)}
.kv .k{font-size:17px}
.kv .v{font-size:14px;color:var(--ink2)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pick{width:100%;min-height:50px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);font-size:17px}
.pick .ck{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pick.on .ck{background:var(--ink);border-color:var(--ink)}
.status{margin-top:10px;font-size:14px;line-height:1.45;color:var(--ink2);min-height:20px}
.namein{width:100%;min-height:50px;padding:0 16px;border-radius:14px;border:1px solid var(--line2);background:transparent;font-size:17px;outline:none}

#toast{position:absolute;left:50%;top:calc(var(--top,24px) + 10px);transform:translateX(-50%) translateY(-16px);opacity:0;z-index:20;
  padding:12px 20px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:14px;white-space:nowrap;pointer-events:none;transition:.2s}
#toast.on{opacity:1;transform:translateX(-50%)}

/* unfolded: calendar | home | folders side by side */
@media (min-width:760px){
  #track{width:100%!important;transform:none!important}
  .page{width:32%;border-right:1px solid var(--line);--pad:22px}
  #pHome{width:36%}
  .dlab{width:46px}
  .ev .t{width:44px}
  .app{font-size:22px}
  .page:last-child{border-right:0}
  .clockrow,.cols{padding-right:40px}
  .over,#sheet{left:50%;right:auto;width:min(520px,100%);margin-left:-260px}
  #sheet{transform:translateY(105%)}
  .over{border-left:1px solid var(--line);border-right:1px solid var(--line)}
}
</style>
</head>
<body>
<div id="app">
  <div id="track">
    <section class="page" id="pCal" aria-label="Calendar">
      <h1>Next 7 days</h1>
      <div class="days scroll" id="days"></div>
      <div class="calfoot"><button class="fab" id="addEv" aria-label="Add event"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1918" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
    </section>

    <section class="page" id="pHome" aria-label="Home">
      <div class="clockrow">
        <p id="clock" role="button" aria-label="Time. Hold for settings"></p>
        <p class="mono" id="date" style="margin:0"></p>
      </div>
      <div class="cols" id="cols">
        <nav class="col" aria-label="People apps"><p class="mono">People</p><div id="colPeople"></div></nav>
        <nav class="col" aria-label="Things apps"><p class="mono">Things</p><div id="colThings"></div></nav>
      </div>
      <div class="scroll" id="plainList" hidden></div>
      <nav id="rail" aria-label="Alphabet"></nav>
    </section>

    <section class="page" id="pFold" aria-label="Folders">
      <h1>Folders</h1>
      <div class="folds scroll" id="folds"></div>
    </section>
  </div>

  <section class="over" id="search" aria-label="Search">
    <label class="qwrap"><span class="mono" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search or ask</span>
      <input id="q" type="text" placeholder="Search" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go"></label>
    <div id="results" class="scroll"></div>
  </section>

  <section class="over" id="now" aria-label="Now">
    <h1>Now</h1>
    <div class="nowlist scroll" id="nowlist"></div>
    <div class="toggles" id="toggles"></div>
  </section>

  <div id="scrim"></div>
  <div id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="sbody" id="sbody"></div></div>
  <div id="toast" role="status"></div>
</div>

<script>
/* Paper — a calm Android home screen.
   Calendar ← Home → Folders. Swipe down: search. Swipe up: Now. Hold the clock (or search "settings"): settings.
   Native bridge: window.PaperNative (android/…/Native.kt). Native events arrive at PAPER.onNative(type, data). */

  const J = (s, d) => { try { const v = typeof s === 'string' ? JSON.parse(s) : s; return v == null ? d : v; } catch (e) { return d; } };
  const call = (fn, ...a) => { try { return N[fn](...a); } catch (e) { console.warn('PaperNative.' + fn, e); return null; } };

  const PEOPLE = [['Phone', ['Phone']], ['Messages', ['Messages', 'Google Messages', 'Samsung Messages']], ['WhatsApp', ['WhatsApp']],
    ['Discord', ['Discord']], ['Instagram', ['Instagram']], ['Gmail', ['Gmail']], ['Proton Mail', ['Proton Mail', 'ProtonMail']]];
  const THINGS = [['Brave', ['Brave', 'Brave Browser']], ['Claude', ['Claude']], ['Camera', ['Camera']], ['Gallery', ['Gallery', 'Google Photos', 'Photos']],

  function onHold(el) {
    const h = el.dataset.hold || '';
    if (h === 'clock') return openSettings();
    if (h.startsWith('folder:')) return folderSheet(+h.split(':')[1]);
    const key = el.dataset.key, label = el.dataset.label;
    appSheet(key, label, h);
  }
  function appSheet(key, label, where) {
    const a = byKey.get(key);
    const btns = [];
    if (a) btns.push('<button class="btn solid" data-act="open" data-k="' + esc(key) + '">Open</button>');
    if (where.startsWith('home:')) btns.push('<button class="btn" data-act="rmhome" data-w="' + esc(where) + '">Remove from Home</button>');
    if (where.startsWith('infolder:')) btns.push('<button class="btn" data-act="rmfold" data-w="' + esc(where) + '" data-k="' + esc(key) + '">Remove from folder</button>');
    if (!a && where.startsWith('home:')) btns.push('<button class="btn" data-act="pickfor" data-w="' + esc(where) + '">Choose the app</button>');
    let moves = '';
    if (a && S.jere) {
      moves = '<div class="grp"><p class="mono">Put in a folder</p>' + S.folders.map((f, i) =>
        '<button class="pick' + (f.keys.includes(key) ? ' on' : '') + '" data-tofold="' + i + '" data-k="' + esc(key) + '"><span>' + esc(f.name) + '</span><span class="ck">' + (f.keys.includes(key) ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ECE9E2" stroke-width="3" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' : '') + '</span></button>').join('') + '</div>';
    }
    sheetKind = 'app';
    openSheet('<h2>' + esc(label || (a && a.label) || 'App') + '</h2>' + (a && a.label !== label ? '<p class="mono" style="margin:0">' + esc(a.label) + '</p>' : '') +
      '<div class="btnrow">' + btns.join('') + '</div>' + moves +
      (a ? '<div class="btnrow" style="margin-top:20px"><button class="btn" data-act="info" data-p="' + esc(a.pkg) + '">App info</button><button class="btn" data-act="uninstall" data-p="' + esc(a.pkg) + '">Uninstall</button></div>' : ''));
  }
  function folderSheet(i) {
    const f = S.folders[i];
    sheetKind = 'folder';
    openSheet('<h2>' + esc(f.name) + '</h2><div class="grp"><p class="mono">Name</p><input class="namein" id="fname" value="' + esc(f.name) + '" aria-label="Folder name"></div>' +
      '<div class="btnrow"><button class="btn solid" data-act="fsave" data-i="' + i + '">Save name</button><button class="btn" data-addto="' + i + '">Add apps</button>' +
      (i > 0 ? '<button class="btn" data-act="fup" data-i="' + i + '">Move up</button>' : '') +
      '<button class="btn" data-act="fdel" data-i="' + i + '">Delete folder</button></div>');
  }

  // App picker: toggles membership in a folder, or fills a Home slot.
  let picker = null;
  function openPicker(p) {
    picker = p;
    const title = p.fold != null ? 'Add to ' + S.folders[p.fold].name : 'Choose the app for this spot';
    const list = APPS.map((a) => {
      const on = p.fold != null ? S.folders[p.fold].keys.includes(a.key) : false;
      return '<button class="pick' + (on ? ' on' : '') + '" data-pk="' + esc(a.key) + '"><span>' + esc(a.label) + '</span><span class="ck">' + (on ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ECE9E2" stroke-width="3" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' : '') + '</span></button>';
    }).join('');
    sheetKind = 'picker';
    openSheet('<h2>' + esc(title) + '</h2><div class="grp">' + list + '</div>' + (p.fold != null ? '<div class="btnrow" style="margin-top:16px"><button class="btn solid" data-act="close">Done</button></div>' : ''));
  }

  function openHomeEditor() {
    const col = (c, label) => '<div class="grp"><p class="mono">' + label + '</p>' + S.home[c].map((h, i) =>
      '<div class="kv"><span class="k">' + esc(h.name) + (h.key && byKey.has(h.key) ? '' : ' <span class="v">· not found</span>') + '</span><span style="display:flex;gap:6px">' +
      (i > 0 ? '<button class="btn sm" data-act="hup" data-w="home:' + c + ':' + i + '">Up</button>' : '') +
      '<button class="btn sm" data-act="pickfor" data-w="home:' + c + ':' + i + '">Change</button>' +
      '<button class="btn sm" data-act="rmhome" data-w="home:' + c + ':' + i + '">Remove</button></span></div>').join('') +
      '<div class="btnrow"><button class="btn" data-act="addhome" data-c="' + c + '">+ Add to ' + label + '</button></div></div>';
    sheetKind = 'home';
    openSheet('<h2>Home apps</h2><p class="hint" style="margin-top:0">Seven a column fits best. Hold any app on Home for the same options.</p>' + col('people', 'People') + col('things', 'Things'));
  }

  // ------------------------------------------------------------------ settings + updates
  let UPD = { page: '', app: '', avail: null };
  function openSettings() {
    const info = J(call('updateInfo'), {});
    const p = J(call('perms'), {});
    const perm = (k, label, name) => '<div class="kv"><span class="k">' + label + '</span>' + (p[k] ? '<span class="v">On</span>' : '<button class="btn sm" data-perm="' + name + '">Turn on</button>') + '</div>';
    const when = info.pageAt ? new Date(info.pageAt) : null;
    sheetKind = 'settings';
    openSheet('<h2>Settings</h2>' +
      '<div class="grp"><p class="mono">Mode</p><div class="seg"><button class="btn' + (S.jere ? ' on' : '') + '" data-mode="1">Jere mode</button><button class="btn' + (S.jere ? '' : ' on') + '" data-mode="0">Plain</button></div>' +
      '<p class="hint" style="margin-top:10px">Jere mode: your 14 apps, your folders. Plain: every app A–Z, folders by type.</p></div>' +
      '<div class="grp"><p class="mono">Updates</p>' +
      '<div class="kv"><span class="k">App</span><span class="v">' + esc(info.app || call('version') || '?') + '</span></div>' +
      '<div class="kv"><span class="k">Page</span><span class="v">' + esc(PAGE_VERSION) + (info.onLive ? ' · from GitHub' + (when ? ', ' + MN[when.getMonth()] + ' ' + when.getDate() + ' ' + hm(when) : '') : ' · built in') + '</span></div>' +
      '<div class="btnrow"><button class="btn solid" data-act="check">Check for updates</button>' +
      (UPD.avail ? '<button class="btn solid" data-act="install">Install app ' + esc(UPD.avail) + '</button>' : '') +
      (info.onLive ? '<button class="btn" data-act="resetpage">Use the built-in page</button>' : '') + '</div>' +
      '<p class="status" id="updStatus">' + esc([UPD.page, UPD.app].filter(Boolean).join(' · ')) + '</p>' +
      '<p class="hint" style="margin-top:4px">Page updates come straight from GitHub (main/index.html) and apply in a second. App updates download the newest release and hand it to Android to install.</p></div>' +
      '<div class="grp"><p class="mono">Layout</p><div class="btnrow" style="margin-top:0"><button class="btn" data-act="edithome">Edit home apps</button><button class="btn" data-act="newfold">New folder</button><button class="btn" data-act="reseed">Re-sort folders</button></div></div>' +
      '<div class="grp"><p class="mono">Access</p>' + perm('isHome', 'Home app', 'home') + perm('calendar', 'Calendar', 'calendar') + perm('notif', 'Notifications (messages, music)', 'notif') + perm('dnd', 'Do Not Disturb', 'dnd') + '</div>' +
      '<div class="grp"><p class="mono">Gestures</p><p class="hint" style="margin-top:0">Swipe right: calendar. Swipe left: folders. Swipe down: search (from the very top: the phone’s notifications). Swipe up: Now. Hold an app or a folder for options. Hold the clock for this sheet.</p></div>' +
      '<p class="mono" style="margin:22px 0 0">Paper · github.com/jere-mee-as/paper</p>');
  }
  function checkUpdates() { UPD.page = 'Checking the page…'; UPD.app = 'Checking the app…'; paintUpd(); call('checkUpdate', 'page'); call('checkUpdate', 'app'); }
  function paintUpd() { const el = $('#updStatus'); if (el) el.textContent = [UPD.page, UPD.app].filter(Boolean).join(' · '); }
  function onUpdate(u) {
    if (!u) return;
    if (u.kind === 'page') {
      UPD.page = { checking: 'Checking the page…', current: 'Page is up to date', ready: 'New page downloaded, applying…', error: 'Page: ' + (u.msg || 'failed'), 'rolled-back': 'The new page didn’t start, so Paper went back to the built-in one' }[u.state] || '';
      if (u.state === 'ready') setTimeout(() => call('applyPage'), 500);
      if (u.state === 'rolled-back') toast('Update rolled back');
    } else if (u.kind === 'app') {
      if (u.state === 'available') { UPD.avail = u.version; UPD.app = 'App ' + u.version + ' is out (you have ' + u.from + ')'; if (sheetKind === 'settings') openSettings(); }
      else UPD.app = { checking: 'Checking the app…', current: 'App is up to date', downloading: 'Downloading ' + (u.pct >= 0 ? u.pct + '%' : '…'), installing: 'Handing it to Android…', confirm: 'Confirm the install', done: 'Installed', canceled: 'Install canceled', 'needs-permission': 'Allow Paper to install apps, then tap Install again', busy: 'Already downloading', error: (u.msg || 'Failed') }[u.state] || '';
    }
    paintUpd();
  }
  function setMode(on) {
    S.jere = !!on; save();
    renderHome(); renderFolders();
    if (sheetKind === 'settings') openSettings();
    toast(on ? 'Jere mode' : 'Plain mode');
  }

  // ------------------------------------------------------------------ clicks
  document.addEventListener('click', (e) => {
    const t = e.target.closest('button, form');
    if (!t) { if (e.target === $('#scrim')) closeSheet(); return; }
    const d = t.dataset;
    if (d.open !== undefined) { open(d.open, d.label); return; }
    if (d.letter) { letter = d.letter; $('#q').value = d.letter; setOver('search'); renderResults(); return; }
    if (d.fold) { S.open = S.open === d.fold ? '' : d.fold; save(); renderFolders(); return; }
    if (d.addto !== undefined) { openPicker({ fold: +d.addto }); return; }
    if (d.ev) { call('openEvent', d.ev); return; }
    if (d.res !== undefined) { runResult(+d.res); return; }
    if (d.route) { call('maps', d.route); return; }
    if (d.media) { call('mediaCmd', d.media); setTimeout(renderNow, 350); return; }
    if (d.perm) { call('askPerm', d.perm); return; }
    if (d.notif) { call('notifOpen', d.notif); return; }
    if (d.reply) { replyOpen = d.reply; renderNow(); return; }
    if (d.clear) { call('notifDismiss', d.clear); setTimeout(renderNow, 200); return; }
    if (d.mode !== undefined) { setMode(d.mode === '1'); return; }
    if (d.tog) return toggle(d.tog);
    if (d.pk) return pick(d.pk);
    if (d.tofold !== undefined) {
      const f = S.folders[+d.tofold], k = d.k;
      if (f.keys.includes(k)) f.keys = f.keys.filter((x) => x !== k); else f.keys.push(k);
      save(); renderFolders(); appSheet(k, (byKey.get(k) || {}).label, 'app'); return;
    }
    if (d.act) return act(d.act, d);
    if (t.id === 'addEv') { const s = new Date(); s.setMinutes(0, 0, 0); s.setHours(s.getHours() + 1); call('newEvent', '', s.getTime(), s.getTime() + 36e5, false); return; }
    if (t.id === 'allowCal') { call('askPerm', 'calendar'); return; }
  });
  document.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = e.target;
    if (f.dataset.send) {
      const text = f.querySelector('input').value.trim();
      if (!text) return;
      const ok = call('notifReply', f.dataset.send, text);
      toast(ok ? 'Sent' : 'Couldn’t send. Open the app instead.');
      replyOpen = ''; setTimeout(renderNow, 300);
    }
  });
  function toggle(k) {
    if (k === 'dnd') { const ok = call('setDnd', !S.dnd); if (ok) { S.dnd = !S.dnd; save(); } else call('askPerm', 'dnd'); }
    if (k === 'torch') { const ok = call('torch', !S.torch); if (ok) { S.torch = !S.torch; save(); } }
    if (k === 'timer') {
      sheetKind = 'timer';
      openSheet('<h2>Timer</h2><div class="toggles" style="grid-template-columns:repeat(3,1fr)">' + [1, 3, 5, 10, 15, 25, 30, 45, 60].map((m) => '<button class="btn" data-act="timer" data-m="' + m + '">' + m + ' min</button>').join('') + '</div>');
      return;
    }
    if (k === 'camera') { call('camera'); return; }
    renderNow();
  }
  function pick(key) {
    if (!picker) return;
    if (picker.fold != null) {
      const f = S.folders[picker.fold];
      if (f.keys.includes(key)) f.keys = f.keys.filter((x) => x !== key); else f.keys.push(key);
      save(); renderFolders(); openPicker(picker);
    } else if (picker.where) {
      const [, c, i] = picker.where.split(':');
      const a = byKey.get(key);
      if (picker.add) S.home[c].push({ name: shortName(a.label), alias: [a.label], key });
      else Object.assign(S.home[c][+i], { key, alias: [a.label], name: S.home[c][+i].key ? shortName(a.label) : S.home[c][+i].name });
      const back = picker.back;
      save(); renderHome(); closeSheet(); if (back) openHomeEditor();
    }
  }
  const shortName = (l) => l.replace(/^Samsung |^Google (?!Maps)/, '').replace(/^YouTube Music$/, 'YT Music');
  function act(a, d) {
    if (a === 'open') { closeSheet(); open(d.k); return; }
    if (a === 'close') { closeSheet(); return; }
    if (a === 'info') { closeSheet(); call('appInfo', d.p); return; }
    if (a === 'uninstall') { closeSheet(); call('uninstall', d.p); return; }
    if (a === 'rmhome') { const [, c, i] = d.w.split(':'); S.home[c].splice(+i, 1); save(); renderHome(); if (sheetKind === 'home') openHomeEditor(); else closeSheet(); return; }
    if (a === 'hup') { const [, c, i] = d.w.split(':'); const L = S.home[c]; [L[i - 1], L[i]] = [L[i], L[i - 1]]; save(); renderHome(); openHomeEditor(); return; }
    if (a === 'pickfor') { const back = sheetKind === 'home'; openPicker({ where: d.w, back }); return; }
    if (a === 'addhome') { openPicker({ where: 'home:' + d.c + ':0', add: true, back: true }); return; }
    if (a === 'rmfold') { const i = +d.w.split(':')[1]; S.folders[i].keys = S.folders[i].keys.filter((x) => x !== d.k); save(); renderFolders(); closeSheet(); return; }
    if (a === 'fsave') { const n = $('#fname').value.trim(); if (n) { if (S.open === S.folders[+d.i].name) S.open = n; S.folders[+d.i].name = n; save(); renderFolders(); } closeSheet(); return; }
    if (a === 'fup') { const i = +d.i, L = S.folders; [L[i - 1], L[i]] = [L[i], L[i - 1]]; save(); renderFolders(); closeSheet(); return; }
    if (a === 'fdel') { S.folders.splice(+d.i, 1); save(); renderFolders(); closeSheet(); toast('Folder deleted'); return; }
    if (a === 'newfold') { S.folders.push({ name: 'New folder', keys: [] }); save(); renderFolders(); folderSheet(S.folders.length - 1); return; }
    if (a === 'reseed') { seedFolders(); save(); renderFolders(); toast('Folders re-sorted'); return; }
    if (a === 'edithome') { openHomeEditor(); return; }
    if (a === 'check') { checkUpdates(); return; }
    if (a === 'install') { UPD.app = 'Starting download…'; paintUpd(); call('installUpdate'); return; }
    if (a === 'resetpage') { call('resetPage'); return; }
    if (a === 'timer') { const m = +d.m; call('timer', m * 60, 'Timer'); closeSheet(); toast(m + ' min timer'); return; }
  }

  // search input
  $('#q').addEventListener('input', () => { letter = ''; renderResults(); });
  $('#q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); runResult(0); } });

  // hold the clock → settings
  $('#clock').setAttribute('data-hold', 'clock');
  $('#scrim').addEventListener('click', closeSheet);

  // ------------------------------------------------------------------ native events
  window.PAPER = {
    onNative(type, data) {
      const v = J(data, data);
      switch (type) {
        case 'back': if (sheetOpen) closeSheet(); else if (over) setOver(''); else setPage(1); break;
        case 'home': goHome(); break;
        case 'apps': loadApps(); renderHome(); renderFolders(); break;
        case 'resume': renderClock(); loadEvents(); renderCal(); if (over === 'now') renderNow(); if (sheetKind === 'settings') openSettings(); break;
        case 'perms': loadEvents(); renderCal(); if (over === 'now') renderNow(); if (sheetKind === 'settings') openSettings(); break;
        case 'notifs': case 'media': if (over === 'now' && !replyOpen) renderNow(); break;
        case 'update': onUpdate(v); break;
      }
    },
    bars() { return ['rgb(236,233,226)', 'rgb(236,233,226)']; }
  };

  // ------------------------------------------------------------------ start
  if (N.__mock) document.documentElement.style.setProperty('--top', '24px');
  else { document.documentElement.style.setProperty('--top', '0px'); document.documentElement.style.setProperty('--bot', '0px'); }
  loadApps(); loadEvents();
  renderHome(); renderCal(); renderFolders(); setPage(1);
  setInterval(renderClock, 10000);
  window.addEventListener('resize', () => setPage(page));
  call('ready');
})();
</script>
</body>
</html>
